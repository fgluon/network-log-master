Match User ai_results_writer
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no

    ChrootDirectory /srv/ai-results-writer

    ForceCommand internal-sftp -d /incoming -u 0437 -P read,opendir,readdir,remove,mkdir,rmdir,rename,readlink,symlink,posix-rename,hardlink,copy-data,setstat,fsetstat,lsetstat

    DisableForwarding yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
